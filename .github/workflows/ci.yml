name: Build CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck client
        run: npm run typecheck:client

      - name: Typecheck gateway
        run: npm run typecheck:gateway

      - name: Typecheck sync checks
        run: npm run typecheck:tests

      - name: Build gateway
        run: npm run build:gateway

      - name: Build client with synthetic runtime identity
        env:
          CLIENT_TENANT_ID: tenant-ci
          CLIENT_BRANCH_ID: branch-ci
          CLIENT_DEVICE_ID: device-ci
          CLIENT_ACTOR_ID: actor-ci
        run: |
          cp .env.example .env
          npm run build:client
